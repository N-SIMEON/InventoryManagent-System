services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
      POSTGRES_DB: inventory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379" 

  web:
    build: ./frontend
    ports:
      - "3000:3000"
  api:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgres://inventory:inventory@postgres:5432/inventory
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
      
volumes:
  postgres_data:
  